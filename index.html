<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>專案備忘錄</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e5e9;
    --text: #1c1e21;
    --text-muted: #6b7280;
    --accent: #3b5bfd;
    --accent-soft: #eef1ff;
    --danger: #e5484d;
    --danger-soft: #fdeceb;
    --ok: #18794e;
    --ok-soft: #e6f6ee;
    --warn: #b45309;
    --warn-soft: #fef3e2;
    --pin: #9333ea;
    --pin-soft: #f5ecff;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; min-height: 100vh; flex-direction: row; }

  /* ---------- Sidebar ---------- */
  #sidebar {
    width: 250px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #sidebar h1 { font-size: 17px; margin: 4px 4px 0; }
  #syncStatus { font-size: 11px; color: var(--text-muted); margin: 0 4px 4px; display: flex; align-items: center; gap: 5px; }
  #syncStatus .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  #syncStatus.offline .dot { background: var(--danger); }

  .nav-item {
    display: flex; align-items: center; gap: 6px;
    padding: 9px 10px; border-radius: var(--radius); cursor: pointer; font-size: 14px; font-weight: 700;
    margin-bottom: 4px;
  }
  .nav-item:hover { background: var(--bg); }
  .nav-item.active { background: var(--pin-soft); color: var(--pin); }
  #sidebarDivider { border: none; border-top: 1px solid var(--border); margin: 2px 0 6px; }

  #projectList { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
  .project-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 10px; border-radius: var(--radius); cursor: pointer; font-size: 14px; gap: 6px;
  }
  .project-item:hover { background: var(--bg); }
  .project-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .project-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .badge {
    font-size: 11px; background: var(--warn-soft); color: var(--warn);
    padding: 1px 7px; border-radius: 999px; font-weight: 600; min-width: 18px; text-align: center;
  }
  .badge.zero { background: var(--bg); color: var(--text-muted); }
  #addProjectRow { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); }
  #newProjectInput { flex: 1; padding: 8px 10px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 13px; }
  .btn {
    border: none; border-radius: var(--radius); padding: 8px 14px; font-size: 13px; font-weight: 600;
    cursor: pointer; background: var(--accent); color: #fff;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
  .btn.icon { padding: 6px 9px; font-size: 13px; }
  .btn.danger { background: var(--danger); }
  .btn.small { padding: 5px 10px; font-size: 12px; }

  /* ---------- Main ---------- */
  #main { flex: 1; padding: 20px 24px 60px; max-width: 1040px; margin: 0 auto; width: 100%; }
  #main.empty { display: flex; align-items: center; justify-content: center; min-height: 60vh; text-align: center; color: var(--text-muted); }
  #pageHeader { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; flex-wrap: wrap; }
  #pageHeader h2 { font-size: 20px; margin: 0; }
  #pageMeta { color: var(--text-muted); font-size: 13px; margin: 4px 0 18px; }
  #pageMeta .overdue-count { color: var(--danger); font-weight: 600; }
  #headerActions { display: flex; gap: 8px; flex-wrap: wrap; }

  #entryForm, #clientForm {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 20px; display: none; flex-direction: column; gap: 10px;
  }
  #entryForm.open, #clientForm.open { display: flex; }
  #entryForm label, #clientForm label { font-size: 12px; color: var(--text-muted); font-weight: 600; margin-bottom: 2px; display: block; }
  #entryForm textarea, #entryForm input, #entryForm select,
  #clientForm textarea, #clientForm input, #clientForm select {
    width: 100%; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 14px; font-family: inherit;
  }
  #entryForm textarea { min-height: 56px; resize: vertical; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .form-row > div { flex: 1; min-width: 140px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }

  #toolBar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  #filterBar { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel);
    font-size: 12.5px; cursor: pointer; color: var(--text-muted);
  }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #searchInput {
    width: 100%; padding: 8px 12px; border-radius: var(--radius); border: 1px solid var(--border);
    font-size: 13.5px; font-family: inherit; background: var(--panel);
  }
  #advFilterRow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-muted); }
  #advFilterRow select { padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 12.5px; background: var(--panel); }
  #advFilterRow .field { display: flex; align-items: center; gap: 6px; }

  .section-title { font-size: 13.5px; font-weight: 700; margin: 22px 0 10px; display: flex; align-items: center; gap: 6px; }
  .section-title:first-child { margin-top: 0; }
  .section-title.pin { color: var(--pin); }
  .section-title.overdue-title { color: var(--danger); }

  #entryList, #overdueList, #pinnedList, #restList, #clientList { display: flex; flex-direction: column; gap: 10px; }
  .entry-card, .client-card { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .entry-card.done { opacity: 0.6; }
  .entry-card.overdue { border-left-color: var(--danger); }
  .entry-card.upcoming { border-left-color: var(--warn); }
  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .entry-content { font-size: 14.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; flex: 1; }
  .status-select { font-size: 12px; font-weight: 600; padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; }
  .status-pending { background: var(--warn-soft); color: var(--warn); }
  .status-inprogress { background: var(--accent-soft); color: var(--accent); }
  .status-done { background: var(--ok-soft); color: var(--ok); }

  .project-tag {
    font-size: 11px; color: var(--accent); background: var(--accent-soft);
    padding: 2px 9px; border-radius: 999px; display: inline-block; margin-bottom: 8px; font-weight: 600;
  }

  .entry-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }
  .entry-meta span b { color: var(--text); font-weight: 600; }
  .entry-meta span.overdue b { color: var(--danger); }
  .entry-meta span.upcoming b { color: var(--warn); }
  .entry-actions, .client-actions { display: flex; gap: 6px; margin-top: 10px; }

  .client-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .client-name { font-size: 15px; font-weight: 700; }
  .client-meta { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 12.5px; color: var(--text-muted); }
  .client-meta b { color: var(--text); font-weight: 600; }

  .empty-state { color: var(--text-muted); font-size: 13.5px; text-align: center; padding: 40px 10px; }
  #globalError {
    display: none; background: var(--danger-soft); color: var(--danger); font-size: 13px;
    padding: 10px 14px; border-radius: var(--radius); margin-bottom: 14px;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 720px) {
    #app { flex-direction: column; }
    #sidebar {
      width: 100%; border-right: none; border-bottom: 1px solid var(--border);
      flex-direction: column; align-items: stretch; padding: 8px 10px; gap: 6px;
      position: sticky; top: 0; z-index: 5;
    }
    #sidebar h1 { display: none; }
    #syncStatus { display: none; }
    #sidebarDivider { display: none; }
    #navRow { display: flex; gap: 6px; overflow-x: auto; }
    .nav-item { flex-shrink: 0; margin-bottom: 0; font-size: 12.5px; padding: 7px 10px; white-space: nowrap; }
    #projectList { flex-direction: row; overflow-x: auto; width: 100%; gap: 6px; padding-bottom: 2px; }
    .project-item { flex-shrink: 0; font-size: 12.5px; padding: 7px 10px; }
    .project-name { max-width: 120px; }
    #addProjectRow { margin-top: 0; padding-top: 6px; border-top: 1px solid var(--border); width: 100%; }
    #newProjectInput { flex: 1; width: auto; }
    #main { padding: 16px 14px 40px; }
    .form-row > div { min-width: 100%; }
  }
</style>
</head>
<body>

<div id="app">
  <div id="sidebar">
    <h1>📋 專案備忘錄</h1>
    <div id="syncStatus"><span class="dot"></span><span id="syncText">同步中…</span></div>
    <div id="navRow">
      <div id="overviewItem" class="nav-item">📊 總覽</div>
      <div id="clientsItem" class="nav-item">👤 客戶資料庫</div>
    </div>
    <hr id="sidebarDivider">
    <ul id="projectList"></ul>
    <div id="addProjectRow">
      <input id="newProjectInput" placeholder="新專案名稱" maxlength="40">
      <button class="btn icon" id="addProjectBtn">＋</button>
    </div>
  </div>

  <div id="main"></div>
</div>

<script>
(function () {
  // ---- Supabase config ----
  const SUPABASE_URL = "https://lgyttghbuktuuqvcmlqd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_qDfkmdBCwzDQV2ZQVeQQLQ_aXQawz_l";
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const POLL_MS = 15000; // auto refresh interval
  const UPCOMING_DAYS = 3;

  let projects = [];
  let entries = [];
  let clients = [];
  let activeView = "project"; // "project" | "overview" | "clients"
  let activeProjectId = null;
  let filterStatus = "all"; // all | pending | inprogress | done
  let filterName = "all";
  let filterAgency = "all";
  let filterDept = "all";
  let searchQuery = "";
  let sortBy = "deadline";  // deadline | created | name | agency | dept
  let editingEntryId = null;
  let editingClientId = null;
  let loaded = false;
  let formOpen = false; // true while add/edit form (entry or client) is open, to avoid auto-refresh wiping unsaved input

  const STATUS_LABEL = { pending: "待處理", inprogress: "處理中", done: "已完成" };
  const SORT_LABEL = { deadline: "Deadline", created: "建立時間", name: "業主", agency: "機關", dept: "科室" };

  function pad(n) { return n.toString().padStart(2, "0"); }
  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function addDays(dateStr, n) {
    const d = new Date(dateStr + "T00:00:00");
    d.setDate(d.getDate() + n);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function formatDate(dateStr) {
    if (!dateStr) return "—";
    const [y, m, d] = dateStr.split("-");
    if (!y) return "—";
    return `${y}/${m}/${d}`;
  }
  function isOverdue(entry) {
    if (!entry.deadline || entry.status === "done") return false;
    return entry.deadline < todayStr();
  }
  function isUpcoming(entry) {
    if (!entry.deadline || entry.status === "done") return false;
    const today = todayStr();
    if (entry.deadline < today) return false;
    return entry.deadline <= addDays(today, UPCOMING_DAYS);
  }
  function getWeekRange() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const day = today.getDay();
    const start = new Date(today); start.setDate(today.getDate() - day);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    const fmt = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    return { startStr: fmt(start), endStr: fmt(end) };
  }
  function isInWeek(dateStr, startStr, endStr) {
    if (!dateStr) return false;
    return dateStr >= startStr && dateStr <= endStr;
  }
  function escapeHtml(str) {
    const d = document.createElement("div");
    d.textContent = str;
    return d.innerHTML;
  }

  // ---- Client helpers ----
  function getClient(id) { return clients.find(c => c.id === id) || null; }
  function eName(e) { return e._client ? (e._client.name || "") : ""; }
  function eAgency(e) { return e._client ? (e._client.agency || "") : ""; }
  function eDept(e) { return e._client ? (e._client.department || "") : ""; }
  function eLineId(e) { return e._client ? (e._client.line_id || "") : ""; }
  function eTitle(e) { return e._client ? (e._client.title || "") : ""; }
  function eEmail(e) { return e._client ? (e._client.email || "") : ""; }
  function ePhone(e) { return e._client ? (e._client.phone || "") : ""; }
  function attachClients() {
    entries.forEach(e => { e._client = getClient(e.client_id); });
  }

  function sortEntries(list, by) {
    const arr = [...list];
    arr.sort((a, b) => {
      if (by === "name") return cmpText(eName(a), eName(b));
      if (by === "agency") return cmpText(eAgency(a), eAgency(b));
      if (by === "dept") return cmpText(eDept(a), eDept(b));
      if (by === "created") return new Date(a.created_at) - new Date(b.created_at);
      if (!a.deadline && !b.deadline) return 0;
      if (!a.deadline) return 1;
      if (!b.deadline) return -1;
      return a.deadline < b.deadline ? -1 : a.deadline > b.deadline ? 1 : 0;
    });
    return arr;
  }
  function cmpText(a, b) {
    const av = (a || "").trim(), bv = (b || "").trim();
    if (!av && !bv) return 0;
    if (!av) return 1;
    if (!bv) return -1;
    return av.localeCompare(bv, "zh-Hant");
  }
  function distinctValues(list, getter) {
    const set = new Set();
    list.forEach(e => { const v = getter(e); if (v && v.trim()) set.add(v.trim()); });
    return [...set].sort((a, b) => a.localeCompare(b, "zh-Hant"));
  }
  function applyFilters(list) {
    let out = list;
    if (filterStatus !== "all") out = out.filter(e => e.status === filterStatus);
    if (filterName !== "all") out = out.filter(e => eName(e).trim() === filterName);
    if (filterAgency !== "all") out = out.filter(e => eAgency(e).trim() === filterAgency);
    if (filterDept !== "all") out = out.filter(e => eDept(e).trim() === filterDept);
    const q = searchQuery.trim().toLowerCase();
    if (q) {
      out = out.filter(e =>
        (e.content || "").toLowerCase().includes(q) ||
        eName(e).toLowerCase().includes(q) ||
        eAgency(e).toLowerCase().includes(q) ||
        eDept(e).toLowerCase().includes(q) ||
        eEmail(e).toLowerCase().includes(q) ||
        ePhone(e).toLowerCase().includes(q)
      );
    }
    return out;
  }

  function csvEscape(v) {
    if (v === null || v === undefined) return "";
    const s = String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function toCSV(list, withProject) {
    const headers = withProject
      ? ["專案", "內容", "業主", "機關", "科室", "職稱", "LINE ID", "登錄日期", "Deadline", "狀態"]
      : ["內容", "業主", "機關", "科室", "職稱", "LINE ID", "登錄日期", "Deadline", "狀態"];
    const lines = [headers.join(",")];
    list.forEach(e => {
      const row = [];
      if (withProject) row.push(csvEscape(projectName(e.project_id)));
      row.push(
        csvEscape(e.content), csvEscape(eName(e)), csvEscape(eAgency(e)), csvEscape(eDept(e)),
        csvEscape(eTitle(e)), csvEscape(eLineId(e)),
        csvEscape(e.log_date), csvEscape(e.deadline), csvEscape(STATUS_LABEL[e.status] || e.status)
      );
      lines.push(row.join(","));
    });
    return lines.join("\r\n");
  }
  function downloadCSV(csvStr, filename) {
    const blob = new Blob(["﻿" + csvStr], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function setSyncStatus(state, text) {
    const el = document.getElementById("syncStatus");
    el.className = state === "offline" ? "offline" : "";
    document.getElementById("syncText").textContent = text;
  }
  function showError(msg) {
    const el = document.getElementById("globalErrorHost");
    if (!el) return;
    el.innerHTML = `<div id="globalError" style="display:flex;">${escapeHtml(msg)}</div>`;
  }
  function clearError() {
    const el = document.getElementById("globalErrorHost");
    if (el) el.innerHTML = "";
  }

  // ---- Data loading ----
  async function loadAll() {
    try {
      const [{ data: pData, error: pErr }, { data: eData, error: eErr }, { data: cData, error: cErr }] = await Promise.all([
        sb.from("projects").select("*").order("created_at", { ascending: true }),
        sb.from("entries").select("*").order("created_at", { ascending: true }),
        sb.from("clients").select("*").order("created_at", { ascending: true }),
      ]);
      if (pErr) throw pErr;
      if (eErr) throw eErr;
      if (cErr) throw cErr;
      projects = pData || [];
      entries = eData || [];
      clients = cData || [];
      attachClients();
      loaded = true;
      setSyncStatus("online", "已同步");
      clearError();
    } catch (e) {
      setSyncStatus("offline", "連線失敗");
      showError("無法連線到資料庫，請檢查網路連線後重新整理。（" + (e.message || e) + "）");
      console.error(e);
    }
    render();
  }

  function projectEntries(pid) { return entries.filter(e => e.project_id === pid); }
  function pendingCount(pid) { return projectEntries(pid).filter(e => e.status !== "done").length; }
  function overdueCount(list) { return list.filter(isOverdue).length; }
  function projectName(pid) { const p = projects.find(p => p.id === pid); return p ? p.name : "（已刪除的專案）"; }
  function ensureActiveProject() {
    if (!projects.find(p => p.id === activeProjectId)) {
      activeProjectId = projects.length ? projects[0].id : null;
    }
  }
  function resetFilters() {
    filterStatus = "all"; filterName = "all"; filterAgency = "all"; filterDept = "all"; searchQuery = "";
  }

  // ---- Rendering ----
  function renderSidebar() {
    document.getElementById("overviewItem").className = "nav-item" + (activeView === "overview" ? " active" : "");
    document.getElementById("clientsItem").className = "nav-item" + (activeView === "clients" ? " active" : "");
    const list = document.getElementById("projectList");
    list.innerHTML = "";
    projects.forEach(p => {
      const li = document.createElement("li");
      li.className = "project-item" + (activeView === "project" && p.id === activeProjectId ? " active" : "");
      const count = pendingCount(p.id);
      li.innerHTML = `
        <span class="project-name">${escapeHtml(p.name)}</span>
        <span class="badge ${count === 0 ? "zero" : ""}">${count}</span>
      `;
      li.addEventListener("click", () => {
        activeView = "project";
        activeProjectId = p.id;
        editingEntryId = null;
        resetFilters();
        render();
      });
      list.appendChild(li);
    });
  }

  function toolbarHtml(scopeList) {
    const names = distinctValues(scopeList, eName);
    const agencies = distinctValues(scopeList, eAgency);
    const depts = distinctValues(scopeList, eDept);
    return `
      <div id="toolBar">
        <div id="filterBar">
          ${["all", "pending", "inprogress", "done"].map(s => `
            <div class="chip" data-status="${s}">
              ${s === "all" ? "全部" : STATUS_LABEL[s]}
            </div>`).join("")}
        </div>
        <input type="text" id="searchInput" placeholder="搜尋內容／業主／機關／科室…">
        <div id="advFilterRow">
          <div class="field">排序：
            <select id="sortSelect">
              ${Object.keys(SORT_LABEL).map(k => `<option value="${k}">${SORT_LABEL[k]}</option>`).join("")}
            </select>
          </div>
          <div class="field">業主：
            <select id="nameFilterSelect">
              <option value="all">全部</option>
              ${names.map(n => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("")}
            </select>
          </div>
          <div class="field">機關：
            <select id="agencyFilterSelect">
              <option value="all">全部</option>
              ${agencies.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join("")}
            </select>
          </div>
          <div class="field">科室：
            <select id="deptFilterSelect">
              <option value="all">全部</option>
              ${depts.map(u => `<option value="${escapeHtml(u)}">${escapeHtml(u)}</option>`).join("")}
            </select>
          </div>
        </div>
      </div>
    `;
  }
  function bindToolbar() {
    document.querySelectorAll(".chip").forEach(chip => {
      if (chip.dataset.status === filterStatus) chip.classList.add("active");
      chip.addEventListener("click", () => { filterStatus = chip.dataset.status; render(); });
    });
    const search = document.getElementById("searchInput");
    search.value = searchQuery;
    search.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      const cursorPos = e.target.selectionStart;
      render();
      const freshSearch = document.getElementById("searchInput");
      if (freshSearch) {
        freshSearch.focus();
        freshSearch.setSelectionRange(cursorPos, cursorPos);
      }
    });
    const sortSel = document.getElementById("sortSelect");
    sortSel.value = sortBy;
    sortSel.addEventListener("change", (e) => { sortBy = e.target.value; render(); });
    const nameSel = document.getElementById("nameFilterSelect");
    nameSel.value = filterName;
    nameSel.addEventListener("change", (e) => { filterName = e.target.value; render(); });
    const agencySel = document.getElementById("agencyFilterSelect");
    agencySel.value = filterAgency;
    agencySel.addEventListener("change", (e) => { filterAgency = e.target.value; render(); });
    const deptSel = document.getElementById("deptFilterSelect");
    deptSel.value = filterDept;
    deptSel.addEventListener("change", (e) => { filterDept = e.target.value; render(); });
  }

  function entryFormHtml() {
    return `
      <form id="entryForm">
        <div>
          <label>內容</label>
          <textarea id="fContent" placeholder="這筆記錄要做什麼／發生了什麼事" required></textarea>
        </div>
        <div class="form-row">
          <div>
            <label>業主</label>
            <select id="fClient">
              <option value="">－ 未指定 －</option>
              ${clients.map(c => `<option value="${c.id}">${escapeHtml(c.name)}${clientTagLabel(c) ? "（" + escapeHtml(clientTagLabel(c)) + "）" : ""}</option>`).join("")}
            </select>
          </div>
          <div>
            <label>登錄日期</label>
            <input type="date" id="fLogDate">
          </div>
          <div>
            <label>Deadline</label>
            <input type="date" id="fDeadline">
          </div>
          <div>
            <label>狀態</label>
            <select id="fStatus">
              <option value="pending">待處理</option>
              <option value="inprogress">處理中</option>
              <option value="done">已完成</option>
            </select>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary small" id="cancelFormBtn">取消</button>
          <button type="submit" class="btn small" id="submitFormBtn">儲存</button>
        </div>
      </form>
    `;
  }
  function clientTagLabel(c) {
    return [c.agency, c.department].filter(Boolean).join(" ");
  }
  function bindEntryForm() {
    document.getElementById("toggleFormBtn")?.addEventListener("click", () => openForm());
    document.getElementById("cancelFormBtn").addEventListener("click", closeForm);
    document.getElementById("entryForm").addEventListener("submit", onSubmitEntry);
  }

  function renderMain() {
    const main = document.getElementById("main");
    main.className = "";

    if (!loaded) {
      main.innerHTML = `<div id="globalErrorHost"></div><div class="empty-state">載入中…</div>`;
      return;
    }

    if (activeView === "overview") { renderOverview(main); return; }
    if (activeView === "clients") { renderClients(main); return; }

    if (!projects.length) {
      main.className = "empty";
      main.innerHTML = `<div><div id="globalErrorHost"></div>還沒有專案<br><span style="font-size:13px">先在左側新增一個專案開始記錄吧</span></div>`;
      return;
    }

    ensureActiveProject();
    const project = projects.find(p => p.id === activeProjectId);
    const all = projectEntries(project.id);
    const filtered = applyFilters(all);
    const sorted = sortEntries(filtered, sortBy);

    const total = all.length;
    const pending = pendingCount(project.id);
    const overdue = overdueCount(all);

    main.innerHTML = `
      <div id="globalErrorHost"></div>
      <div id="pageHeader">
        <h2>${escapeHtml(project.name)}</h2>
        <div id="headerActions">
          <button class="btn secondary small" id="exportBtn">匯出 CSV</button>
          <button class="btn secondary small" id="refreshBtn">重新整理</button>
          <button class="btn secondary small" id="renameProjectBtn">重新命名</button>
          <button class="btn danger small" id="deleteProjectBtn">刪除專案</button>
        </div>
      </div>
      <div id="pageMeta">共 ${total} 筆記錄・${pending} 筆待處理${overdue ? `・<span class="overdue-count">${overdue} 筆已逾期</span>` : ""}</div>

      <button class="btn" id="toggleFormBtn" style="margin-bottom:14px;">＋ 新增記錄</button>

      ${entryFormHtml()}

      ${toolbarHtml(all)}

      <div id="entryList"></div>
    `;

    document.getElementById("exportBtn").addEventListener("click", () => {
      downloadCSV(toCSV(sorted, false), `${project.name}_備忘錄.csv`);
    });
    document.getElementById("refreshBtn").addEventListener("click", loadAll);
    document.getElementById("renameProjectBtn").addEventListener("click", () => renameProject(project));
    document.getElementById("deleteProjectBtn").addEventListener("click", () => deleteProject(project));
    bindEntryForm();
    bindToolbar();

    const entryList = document.getElementById("entryList");
    if (!sorted.length) {
      entryList.innerHTML = `<div class="empty-state">這個篩選條件下沒有記錄</div>`;
    } else {
      sorted.forEach(e => entryList.appendChild(renderEntryCard(e)));
    }
  }

  function renderOverview(main) {
    const { startStr, endStr } = getWeekRange();
    const all = entries;
    const filtered = applyFilters(all);

    const overdueList = sortEntries(filtered.filter(isOverdue), "deadline");
    const overdueIds = new Set(overdueList.map(e => e.id));
    const pinned = sortEntries(filtered.filter(e => !overdueIds.has(e.id) && isInWeek(e.deadline, startStr, endStr)), "deadline");
    const pinnedIds = new Set(pinned.map(e => e.id));
    const rest = sortEntries(filtered.filter(e => !overdueIds.has(e.id) && !pinnedIds.has(e.id)), sortBy);
    const combinedForExport = [...overdueList, ...pinned, ...rest];

    const totalPending = all.filter(e => e.status !== "done").length;
    const totalOverdue = overdueCount(all);

    main.innerHTML = `
      <div id="globalErrorHost"></div>
      <div id="pageHeader">
        <h2>📊 總覽</h2>
        <div id="headerActions">
          <button class="btn secondary small" id="exportBtn">匯出 CSV</button>
          <button class="btn secondary small" id="refreshBtn">重新整理</button>
        </div>
      </div>
      <div id="pageMeta">共 ${all.length} 筆記錄・${totalPending} 筆待處理（跨 ${projects.length} 個專案）${totalOverdue ? `・<span class="overdue-count">${totalOverdue} 筆已逾期</span>` : ""}</div>

      ${toolbarHtml(all)}

      ${overdueList.length ? `
        <div class="section-title overdue-title">⚠️ 已逾期</div>
        <div id="overdueList"></div>
      ` : ""}

      <div class="section-title pin">📌 本週待辦（${formatDate(startStr)} - ${formatDate(endStr)}）</div>
      <div id="pinnedList"></div>

      <div class="section-title">其他工作</div>
      <div id="restList"></div>
    `;

    document.getElementById("exportBtn").addEventListener("click", () => {
      downloadCSV(toCSV(combinedForExport, true), `專案備忘錄_總覽.csv`);
    });
    document.getElementById("refreshBtn").addEventListener("click", loadAll);
    bindToolbar();

    if (overdueList.length) {
      const overdueEl = document.getElementById("overdueList");
      overdueList.forEach(e => overdueEl.appendChild(renderEntryCard(e)));
    }
    const pinnedList = document.getElementById("pinnedList");
    if (!pinned.length) {
      pinnedList.innerHTML = `<div class="empty-state">本週沒有到期的工作</div>`;
    } else {
      pinned.forEach(e => pinnedList.appendChild(renderEntryCard(e)));
    }
    const restList = document.getElementById("restList");
    if (!rest.length) {
      restList.innerHTML = `<div class="empty-state">沒有其他記錄</div>`;
    } else {
      rest.forEach(e => restList.appendChild(renderEntryCard(e)));
    }
  }

  function renderEntryCard(e) {
    const card = document.createElement("div");
    const overdue = isOverdue(e);
    const upcoming = !overdue && isUpcoming(e);
    card.className = "entry-card" + (e.status === "done" ? " done" : "") + (overdue ? " overdue" : "") + (upcoming ? " upcoming" : "");
    const deadlineClass = overdue ? "overdue" : upcoming ? "upcoming" : "";
    const deadlineSuffix = overdue ? "（已逾期）" : upcoming ? "（即將到期）" : "";
    card.innerHTML = `
      ${activeView === "overview" ? `<div class="project-tag">${escapeHtml(projectName(e.project_id))}</div>` : ""}
      <div class="entry-top">
        <div class="entry-content">${escapeHtml(e.content)}</div>
        <select class="status-select status-${e.status}" data-id="${e.id}">
          <option value="pending" ${e.status === "pending" ? "selected" : ""}>待處理</option>
          <option value="inprogress" ${e.status === "inprogress" ? "selected" : ""}>處理中</option>
          <option value="done" ${e.status === "done" ? "selected" : ""}>已完成</option>
        </select>
      </div>
      <div class="entry-meta">
        <span>業主：<b>${e._client ? escapeHtml(e._client.name) : "—"}</b></span>
        <span>機關：<b>${eAgency(e) ? escapeHtml(eAgency(e)) : "—"}</b></span>
        <span>科室：<b>${eDept(e) ? escapeHtml(eDept(e)) : "—"}</b></span>
        <span>職稱：<b>${eTitle(e) ? escapeHtml(eTitle(e)) : "—"}</b></span>
        <span>LINE ID：<b>${eLineId(e) ? escapeHtml(eLineId(e)) : "—"}</b></span>
        <span>登錄日期：<b>${formatDate(e.log_date)}</b></span>
        <span class="${deadlineClass}">Deadline：<b>${formatDate(e.deadline)}${deadlineSuffix}</b></span>
      </div>
      <div class="entry-actions">
        <button class="btn secondary small" data-action="edit" data-id="${e.id}">編輯</button>
        <button class="btn danger small" data-action="delete" data-id="${e.id}">刪除</button>
      </div>
    `;
    card.querySelector(".status-select").addEventListener("change", async (ev) => {
      const newStatus = ev.target.value;
      try {
        const { error } = await sb.from("entries").update({ status: newStatus }).eq("id", e.id);
        if (error) throw error;
        e.status = newStatus;
        render();
      } catch (err) {
        showError("更新狀態失敗：" + (err.message || err));
      }
    });
    card.querySelector('[data-action="edit"]').addEventListener("click", () => openForm(e));
    card.querySelector('[data-action="delete"]').addEventListener("click", async () => {
      if (!confirm("確定要刪除這筆記錄嗎？")) return;
      try {
        const { error } = await sb.from("entries").delete().eq("id", e.id);
        if (error) throw error;
        entries = entries.filter(x => x.id !== e.id);
        render();
      } catch (err) {
        showError("刪除失敗：" + (err.message || err));
      }
    });
    return card;
  }

  function openForm(entry) {
    formOpen = true;
    const form = document.getElementById("entryForm");
    form.classList.add("open");
    const toggleBtn = document.getElementById("toggleFormBtn");
    if (toggleBtn) toggleBtn.style.display = "none";
    if (entry) {
      editingEntryId = entry.id;
      document.getElementById("fContent").value = entry.content;
      document.getElementById("fClient").value = entry.client_id || "";
      document.getElementById("fLogDate").value = entry.log_date || todayStr();
      document.getElementById("fDeadline").value = entry.deadline || "";
      document.getElementById("fStatus").value = entry.status;
      document.getElementById("submitFormBtn").textContent = "更新";
    } else {
      editingEntryId = null;
      document.getElementById("fLogDate").value = todayStr();
      document.getElementById("submitFormBtn").textContent = "儲存";
    }
    document.getElementById("fContent").focus();
  }
  function closeForm() {
    formOpen = false;
    const form = document.getElementById("entryForm");
    if (!form) return;
    form.classList.remove("open");
    const toggleBtn = document.getElementById("toggleFormBtn");
    if (toggleBtn) toggleBtn.style.display = "inline-block";
    editingEntryId = null;
  }

  async function onSubmitEntry(ev) {
    ev.preventDefault();
    const content = document.getElementById("fContent").value.trim();
    if (!content) return;
    const submitBtn = document.getElementById("submitFormBtn");
    submitBtn.disabled = true;

    const clientVal = document.getElementById("fClient").value;
    const payload = {
      content,
      client_id: clientVal || null,
      log_date: document.getElementById("fLogDate").value || todayStr(),
      deadline: document.getElementById("fDeadline").value || null,
      status: document.getElementById("fStatus").value,
    };

    try {
      if (editingEntryId) {
        const { error } = await sb.from("entries").update(payload).eq("id", editingEntryId);
        if (error) throw error;
      } else {
        payload.project_id = activeProjectId;
        const { error } = await sb.from("entries").insert(payload);
        if (error) throw error;
      }
      closeForm();
      await loadAll();
    } catch (err) {
      showError("儲存失敗：" + (err.message || err));
    } finally {
      submitBtn.disabled = false;
    }
  }

  async function renameProject(project) {
    const name = prompt("專案名稱", project.name);
    if (!name || !name.trim()) return;
    try {
      const { error } = await sb.from("projects").update({ name: name.trim() }).eq("id", project.id);
      if (error) throw error;
      project.name = name.trim();
      render();
    } catch (err) {
      showError("重新命名失敗：" + (err.message || err));
    }
  }
  async function deleteProject(project) {
    if (!confirm(`確定要刪除專案「${project.name}」嗎？其下所有記錄也會一併刪除。`)) return;
    try {
      const { error } = await sb.from("projects").delete().eq("id", project.id);
      if (error) throw error;
      projects = projects.filter(p => p.id !== project.id);
      entries = entries.filter(e => e.project_id !== project.id);
      activeProjectId = null;
      render();
    } catch (err) {
      showError("刪除專案失敗：" + (err.message || err));
    }
  }

  // ---- Clients view ----
  function renderClients(main) {
    main.innerHTML = `
      <div id="globalErrorHost"></div>
      <div id="pageHeader">
        <h2>👤 客戶資料庫</h2>
        <div id="headerActions">
          <button class="btn secondary small" id="refreshBtn">重新整理</button>
        </div>
      </div>
      <div id="pageMeta">共 ${clients.length} 位客戶</div>

      <button class="btn" id="toggleClientFormBtn" style="margin-bottom:14px;">＋ 新增客戶</button>

      <form id="clientForm">
        <div class="form-row">
          <div>
            <label>業主姓名</label>
            <input type="text" id="cName" placeholder="業主姓名" required>
          </div>
          <div>
            <label>機關</label>
            <input type="text" id="cAgency" placeholder="機關">
          </div>
          <div>
            <label>科室</label>
            <input type="text" id="cDept" placeholder="科室">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label>職稱</label>
            <input type="text" id="cTitle" placeholder="職稱">
          </div>
          <div>
            <label>LINE ID</label>
            <input type="text" id="cLineId" placeholder="LINE ID">
          </div>
          <div>
            <label>Email</label>
            <input type="email" id="cEmail" placeholder="Email">
          </div>
          <div>
            <label>電話</label>
            <input type="text" id="cPhone" placeholder="電話">
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn secondary small" id="cancelClientFormBtn">取消</button>
          <button type="submit" class="btn small" id="submitClientFormBtn">儲存</button>
        </div>
      </form>

      <div id="clientList"></div>
    `;

    document.getElementById("refreshBtn").addEventListener("click", loadAll);
    document.getElementById("toggleClientFormBtn").addEventListener("click", () => openClientForm());
    document.getElementById("cancelClientFormBtn").addEventListener("click", closeClientForm);
    document.getElementById("clientForm").addEventListener("submit", onSubmitClient);

    const list = document.getElementById("clientList");
    if (!clients.length) {
      list.innerHTML = `<div class="empty-state">還沒有客戶資料，點上方「＋ 新增客戶」建立第一筆</div>`;
      return;
    }
    const sorted = [...clients].sort((a, b) => cmpText(a.name, b.name));
    sorted.forEach(c => list.appendChild(renderClientCard(c)));
  }

  function renderClientCard(c) {
    const card = document.createElement("div");
    card.className = "client-card";
    const usedCount = entries.filter(e => e.client_id === c.id).length;
    card.innerHTML = `
      <div class="client-top">
        <div class="client-name">${escapeHtml(c.name)}</div>
      </div>
      <div class="client-meta">
        <span>機關：<b>${c.agency ? escapeHtml(c.agency) : "—"}</b></span>
        <span>科室：<b>${c.department ? escapeHtml(c.department) : "—"}</b></span>
        <span>職稱：<b>${c.title ? escapeHtml(c.title) : "—"}</b></span>
        <span>LINE ID：<b>${c.line_id ? escapeHtml(c.line_id) : "—"}</b></span>
        <span>Email：<b>${c.email ? escapeHtml(c.email) : "—"}</b></span>
        <span>電話：<b>${c.phone ? escapeHtml(c.phone) : "—"}</b></span>
        <span>目前追蹤中：<b>${usedCount} 筆</b></span>
      </div>
      <div class="client-actions">
        <button class="btn secondary small" data-action="edit">編輯</button>
        <button class="btn danger small" data-action="delete">刪除</button>
      </div>
    `;
    card.querySelector('[data-action="edit"]').addEventListener("click", () => openClientForm(c));
    card.querySelector('[data-action="delete"]').addEventListener("click", async () => {
      const warn = usedCount ? `目前有 ${usedCount} 筆記錄使用這位客戶，刪除後那些記錄的業主欄位會變成未指定。確定要刪除「${c.name}」嗎？` : `確定要刪除「${c.name}」嗎？`;
      if (!confirm(warn)) return;
      try {
        const { error } = await sb.from("clients").delete().eq("id", c.id);
        if (error) throw error;
        await loadAll();
      } catch (err) {
        showError("刪除客戶失敗：" + (err.message || err));
      }
    });
    return card;
  }

  function openClientForm(client) {
    formOpen = true;
    const form = document.getElementById("clientForm");
    form.classList.add("open");
    document.getElementById("toggleClientFormBtn").style.display = "none";
    if (client) {
      editingClientId = client.id;
      document.getElementById("cName").value = client.name;
      document.getElementById("cAgency").value = client.agency || "";
      document.getElementById("cDept").value = client.department || "";
      document.getElementById("cTitle").value = client.title || "";
      document.getElementById("cLineId").value = client.line_id || "";
      document.getElementById("cEmail").value = client.email || "";
      document.getElementById("cPhone").value = client.phone || "";
      document.getElementById("submitClientFormBtn").textContent = "更新";
    } else {
      editingClientId = null;
      document.getElementById("submitClientFormBtn").textContent = "儲存";
    }
    document.getElementById("cName").focus();
  }
  function closeClientForm() {
    formOpen = false;
    const form = document.getElementById("clientForm");
    if (!form) return;
    form.classList.remove("open");
    const toggleBtn = document.getElementById("toggleClientFormBtn");
    if (toggleBtn) toggleBtn.style.display = "inline-block";
    editingClientId = null;
  }
  async function onSubmitClient(ev) {
    ev.preventDefault();
    const name = document.getElementById("cName").value.trim();
    if (!name) return;
    const submitBtn = document.getElementById("submitClientFormBtn");
    submitBtn.disabled = true;
    const payload = {
      name,
      agency: document.getElementById("cAgency").value.trim() || null,
      department: document.getElementById("cDept").value.trim() || null,
      title: document.getElementById("cTitle").value.trim() || null,
      line_id: document.getElementById("cLineId").value.trim() || null,
      email: document.getElementById("cEmail").value.trim() || null,
      phone: document.getElementById("cPhone").value.trim() || null,
    };
    try {
      if (editingClientId) {
        const { error } = await sb.from("clients").update(payload).eq("id", editingClientId);
        if (error) throw error;
      } else {
        const { error } = await sb.from("clients").insert(payload);
        if (error) throw error;
      }
      closeClientForm();
      await loadAll();
    } catch (err) {
      showError("儲存客戶失敗：" + (err.message || err));
    } finally {
      submitBtn.disabled = false;
    }
  }

  document.getElementById("overviewItem").addEventListener("click", () => {
    activeView = "overview";
    editingEntryId = null;
    resetFilters();
    render();
  });
  document.getElementById("clientsItem").addEventListener("click", () => {
    activeView = "clients";
    editingClientId = null;
    render();
  });
  document.getElementById("addProjectBtn").addEventListener("click", addProject);
  document.getElementById("newProjectInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") addProject();
  });
  async function addProject() {
    const input = document.getElementById("newProjectInput");
    const name = input.value.trim();
    if (!name) return;
    input.disabled = true;
    try {
      const { data, error } = await sb.from("projects").insert({ name }).select().single();
      if (error) throw error;
      projects.push(data);
      activeView = "project";
      activeProjectId = data.id;
      input.value = "";
      render();
    } catch (err) {
      showError("新增專案失敗：" + (err.message || err));
    } finally {
      input.disabled = false;
    }
  }

  function render() {
    renderSidebar();
    renderMain();
  }

  loadAll();
  setInterval(() => { if (!formOpen) loadAll(); }, POLL_MS);
})();
</script>
</body>
</html>
